name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.UNMARK_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.UNMARK_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UNMARK_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.UNMARK_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/unmark-release.jks"
            {
              echo "UNMARK_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/unmark-release.jks"
              echo "UNMARK_RELEASE_KEYSTORE_PASSWORD=$STORE_PASS"
              echo "UNMARK_RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "UNMARK_RELEASE_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/Unmark.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unmark-apk
          path: app/build/outputs/apk/release/Unmark.apk

      - name: Publish latest build to Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: false
          files: app/build/outputs/apk/release/Unmark.apk
